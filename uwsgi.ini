[uwsgi]
# Socket and pid file location/permission.
uwsgi-socket = /home/ubuntu/dmoj-site.sock
chmod-socket = 666
pidfile = /home/ubuntu/dmoj-site.pid

# You should create an account dedicated to running dmoj under uwsgi.
uid = ubuntu
gid = ubuntu

# Paths.
chdir = /home/ubuntu/educational-online-judge/
pythonpath = /home/ubuntu/educational-online-judge/
virtualenv = /home/ubuntu/dmojsite/

# Details regarding DMOJ application.
protocol = uwsgi
master = true
env = DJANGO_SETTINGS_MODULE=dmoj.settings
module = dmoj.wsgi:application
optimize = 2

# Fixed worker pool (previously dynamic via "cheaper", which repeatedly failed to keep up under
# real traffic -- see CANVIS_I_MILLORES.md entry #70/#71). 6 workers leaves headroom on this 8-core
# box for the judge processes, MySQL, celery, and nginx.
memory-report = true
processes = 6
listen = 256
harakiri = 30
